<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <!-- منع ظهور أي محتوى أو وميض شاشة -->
  <style>
    html, body {
      display: none !important;
      visibility: hidden !important;
      background: #000;
    }
  </style>

  <!-- تحويل فوري ومسح الصفحة من سجل الرجوع (Back History) -->
  <script>
    window.location.replace("https://swe.abdelra7man.dev");
  </script>

  <!-- تحويل احتياطي في حالة تعطيل الـ JavaScript في المتصفح -->
  <meta http-equiv="refresh" content="0; url=https://swe.abdelra7man.dev">
  <link rel="canonical" href="https://swe.abdelra7man.dev">
</head>

</html>
